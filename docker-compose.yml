services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: hoeckeler
      POSTGRES_USER: hoeckeler
      POSTGRES_PASSWORD: change-me-db-password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hoeckeler -d hoeckeler"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - event_uploads:/app/uploads
    environment:
      DATABASE_URL: postgresql://hoeckeler:change-me-db-password@db:5432/hoeckeler
      AUTH_SECRET: replace-with-a-long-random-secret
      BOOTSTRAP_ADMIN: admin
      BOOTSTRAP_PASSWORD: ChangeMe123!
      PORT: 8080
      ALLOW_JSON_FALLBACK: "false"
      COOKIE_SECURE: "false"
volumes:
  event_uploads:
    name: hoeckeler_event_planner_uploads
  postgres_data:
    name: hoeckeler_event_planner_postgres
