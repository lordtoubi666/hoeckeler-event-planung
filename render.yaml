services:
  - type: web
    name: hoeckeler-event-planung-test
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hoeckeler-event-planung-test-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN
        value: admin
      - key: BOOTSTRAP_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: ALLOW_JSON_FALLBACK
        value: "false"
      - key: UPLOAD_DIR
        value: /app/uploads
      - key: MAX_EVENT_FILE_BYTES
        value: "20971520"

databases:
  - name: hoeckeler-event-planung-test-db
    plan: free
    region: frankfurt
    databaseName: hoeckeler
    user: hoeckeler
    ipAllowList: []
