services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hoeckeler}
      POSTGRES_USER: ${POSTGRES_USER:-hoeckeler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - prod_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hoeckeler} -d ${POSTGRES_DB:-hoeckeler}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-hoeckeler}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-hoeckeler}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      BOOTSTRAP_ADMIN: ${BOOTSTRAP_ADMIN:-admin}
      BOOTSTRAP_PASSWORD: ${BOOTSTRAP_PASSWORD:?set BOOTSTRAP_PASSWORD}
      PORT: 8080
      ALLOW_JSON_FALLBACK: "false"
      COOKIE_SECURE: "true"
      CROSS_SITE_COOKIES: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      TEST_MODE: "false"
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      PROD_DOMAIN: ${PROD_DOMAIN:?set PROD_DOMAIN}
    volumes:
      - ./deploy/Caddyfile.production:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  prod_postgres:
    name: hoeckeler_event_planner_prod_postgres
  caddy_data:
    name: hoeckeler_event_planner_caddy_data
  caddy_config:
    name: hoeckeler_event_planner_caddy_config
